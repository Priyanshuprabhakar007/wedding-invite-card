<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="sealGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#b81d43"/>
      <stop offset="45%" stop-color="#800624"/>
      <stop offset="85%" stop-color="#540217"/>
      <stop offset="100%" stop-color="#38010e"/>
    </radialGradient>
    <radialGradient id="goldGrad" cx="30%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="35%" stop-color="#dfb76c"/>
      <stop offset="70%" stop-color="#b88628"/>
      <stop offset="100%" stop-color="#694a11"/>
    </radialGradient>
    <radialGradient id="innerShine" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#a81a3d" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#66021f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#400112"/>
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1f0208" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#ffd885" flood-opacity="0.6"/>
      <feDropShadow dx="-1" dy="-1.5" stdDeviation="1" flood-color="#2d000a" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Organic wax seal edge -->
    <path d="M150,22 C175,21 198,28 218,42 C236,54 256,66 267,86 C278,107 274,130 279,153 C284,175 277,199 265,218 C252,238 234,254 212,265 C190,276 166,274 143,277 C120,281 97,272 78,260 C58,247 41,228 32,207 C22,185 27,161 24,138 C20,115 28,92 41,74 C54,55 74,40 96,31 C114,23 133,22 150,22 Z" fill="url(#sealGrad)" />
    
    <!-- Outer rim ridge -->
    <circle cx="150" cy="150" r="105" fill="none" stroke="#941433" stroke-width="4" opacity="0.6"/>
    <circle cx="150" cy="150" r="98" fill="url(#innerShine)" stroke="#450212" stroke-width="3"/>
    
    <!-- Golden beaded ring -->
    <circle cx="150" cy="150" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3,6" filter="url(#emboss)"/>
    <circle cx="150" cy="150" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.7"/>

    <!-- Center Monogram / Crest -->
    <g filter="url(#emboss)">
      <!-- Laurel Wreath -->
      <path d="M110,185 C95,160 95,130 112,105 C113,103 118,110 116,113 C102,133 103,158 116,177 Z" fill="url(#goldGrad)" opacity="0.85"/>
      <path d="M190,185 C205,160 205,130 188,105 C187,103 182,110 184,113 C198,133 197,158 184,177 Z" fill="url(#goldGrad)" opacity="0.85"/>
      
      <!-- Crown Top -->
      <path d="M135,108 L142,118 L150,105 L158,118 L165,108 L162,123 L138,123 Z" fill="url(#goldGrad)"/>
      <circle cx="135" cy="106" r="2" fill="url(#goldGrad)"/>
      <circle cx="150" cy="103" r="2.5" fill="url(#goldGrad)"/>
      <circle cx="165" cy="106" r="2" fill="url(#goldGrad)"/>

      <!-- Initials Monogram -->
      <text x="150" y="162" font-family="'Beau Rivage', 'Great Vibes', 'Playfair Display', serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">W</text>
      
      <!-- Subtext / Ribbon text -->
      <text x="150" y="186" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">INVITATION</text>
    </g>

    <!-- Shading & Highlights -->
    <path d="M85,60 C125,35 185,38 225,65" fill="none" stroke="#ff8ba0" stroke-width="4" opacity="0.25" stroke-linecap="round"/>
  </g>
</svg>
