<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="roseGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#cf2d53"/>
      <stop offset="60%" stop-color="#8c0a2a"/>
      <stop offset="100%" stop-color="#4f0214"/>
    </radialGradient>
    <radialGradient id="goldPetal" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#faecc5"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#805b10"/>
    </radialGradient>
  </defs>
  <!-- Rose Blossom -->
  <g transform="translate(50,50)">
    <!-- Outer Petals -->
    <path d="M0,0 C-20,-45 20,-45 0,0" fill="url(#roseGrad)" transform="rotate(0)"/>
    <path d="M0,0 C-25,-42 25,-42 0,0" fill="url(#roseGrad)" transform="rotate(60)"/>
    <path d="M0,0 C-25,-42 25,-42 0,0" fill="url(#roseGrad)" transform="rotate(120)"/>
    <path d="M0,0 C-25,-42 25,-42 0,0" fill="url(#roseGrad)" transform="rotate(180)"/>
    <path d="M0,0 C-25,-42 25,-42 0,0" fill="url(#roseGrad)" transform="rotate(240)"/>
    <path d="M0,0 C-25,-42 25,-42 0,0" fill="url(#roseGrad)" transform="rotate(300)"/>
    <!-- Inner Petals -->
    <path d="M0,0 C-15,-30 15,-30 0,0" fill="#a81033" transform="rotate(30)"/>
    <path d="M0,0 C-15,-30 15,-30 0,0" fill="#a81033" transform="rotate(90)"/>
    <path d="M0,0 C-15,-30 15,-30 0,0" fill="#a81033" transform="rotate(150)"/>
    <path d="M0,0 C-15,-30 15,-30 0,0" fill="#a81033" transform="rotate(210)"/>
    <path d="M0,0 C-15,-30 15,-30 0,0" fill="#a81033" transform="rotate(270)"/>
    <path d="M0,0 C-15,-30 15,-30 0,0" fill="#a81033" transform="rotate(330)"/>
    <!-- Center Core -->
    <circle cx="0" cy="0" r="10" fill="url(#goldPetal)"/>
    <circle cx="0" cy="0" r="5" fill="#4a0010"/>
  </g>
</svg>
