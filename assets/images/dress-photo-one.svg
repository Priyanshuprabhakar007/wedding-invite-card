<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="suitBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1a21"/>
      <stop offset="100%" stop-color="#190e13"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e0a3"/>
      <stop offset="50%" stop-color="#c99738"/>
      <stop offset="100%" stop-color="#734e0a"/>
    </linearGradient>
  </defs>
  <!-- Gold Border Frame -->
  <rect x="8" y="8" width="384" height="484" rx="12" fill="url(#suitBg)" stroke="url(#goldFrame)" stroke-width="4"/>
  <rect x="18" y="18" width="364" height="464" rx="8" fill="none" stroke="url(#goldFrame)" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Attire Art -->
  <g transform="translate(200, 240)">
    <!-- Sherwani / Tuxedo silhouette -->
    <path d="M-60,180 L-50,0 C-30,-20 -20,-30 0,-30 C20,-30 30,-20 50,0 L60,180 Z" fill="#3b2029" stroke="#b38734" stroke-width="1.5"/>
    <path d="M-20,-30 L0,50 L20,-30" fill="#fffaf2" stroke="#b38734" stroke-width="1"/>
    <!-- Bowtie / Royal Stole / Brooch -->
    <polygon points="-15, -15 15, -15 0, -5" fill="#8c112e"/>
    <polygon points="-15, 5 15, 5 0, -5" fill="#8c112e"/>
    <circle cx="0" cy="-5" r="3" fill="#dfbe76"/>
    <!-- Pocket square & buttons -->
    <polygon points="25, 20 40, 10 35, 25" fill="#dfbe76"/>
    <circle cx="0" cy="70" r="3" fill="#dfbe76"/>
    <circle cx="0" cy="100" r="3" fill="#dfbe76"/>
    <circle cx="0" cy="130" r="3" fill="#dfbe76"/>
  </g>
  <text x="200" y="440" font-family="'Cormorant Garamond', serif" font-size="22" font-style="italic" fill="#dfbe76" text-anchor="middle" letter-spacing="2">Gentlemen Formal Attire</text>
</svg>
